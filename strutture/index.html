<!DOCTYPE html>
<html>
<head>
  <script>
    const userLang = navigator.language || navigator.userLanguage; 
    
    // Se la lingua del browser inizia con 'it', scarica la versione italiana
    if (userLang.startsWith('it')) {
      window.location.href = "guida-it.pdf";
    } else {
      // Per tutte le altre lingue, imposta l'inglese come fallback
      window.location.href = "guida-en.pdf";
    }
  </script>
</head>
<body>
  <p>Reindirizzamento al download in corso...</p>
</body>
</html>
